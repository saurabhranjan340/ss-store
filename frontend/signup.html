<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Create your SS Store account">
  <title>SS Store · Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth-page="signup">
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="signup-title">
      <a class="brand" href="index.html" aria-label="SS Store home">
        <span class="brand-mark">SS</span>
        <span><strong>SS Store</strong><small>fresh in a flash</small></span>
      </a>
      <div class="auth-heading">
        <p class="eyebrow">Start shopping faster</p>
        <h1 id="signup-title">Your quick basket, saved.</h1>
        <p>Create an account for smoother reorders and delivery updates.</p>
      </div>
      <div id="auth-feedback" class="feedback" role="alert" aria-live="polite" hidden></div>
      <form id="signup-form" novalidate>
        <label class="field-label" for="name">Name</label>
        <input class="field" id="name" name="name" type="text" autocomplete="name" placeholder="Saurabh Ranjan" required>
        <small class="field-error" data-error-for="name"></small>
        <label class="field-label" for="email">Email</label>
        <input class="field" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <small class="field-error" data-error-for="email"></small>
        <label class="field-label" for="phone">Phone</label>
        <input class="field" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210" required>
        <small class="field-error" data-error-for="phone"></small>
        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input class="field" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
          <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button>
        </div>
        <small class="field-error" data-error-for="password"></small>
        <label class="field-label" for="confirm-password">Confirm password</label>
        <div class="password-wrap">
          <input class="field" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
          <button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Show password">Show</button>
        </div>
        <small class="field-error" data-error-for="confirmPassword"></small>
        <button class="primary-button" id="signup-button" type="submit"><span class="button-label">Create account</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
    <p class="auth-footnote">Fast groceries, simple checkout.</p>
  </main>
  <script src="js/auth.js" defer></script>
</body>
</html>
